<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lamp</title>
<style>
body {
    text-align: center;
    margin-top: 100px;
    font-family: Arial;
    background: #111;
    color: white;
    transition: 0.3s;
}
#lamp {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: gray;
    margin: 30px auto;
    transition: 0.3s;
}
.on {
    background: yellow;
    box-shadow: 0 0 100px yellow;
}
button {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>
<body>

<h1>💡 Лампочка</h1>

<div id="lamp"></div>

<button onclick="toggleLamp()">Вкл / Выкл</button>

<script>
function toggleLamp() {
    document.getElementById("lamp").classList.toggle("on");
}
</script>

</body>
</html>
